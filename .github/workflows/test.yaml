name: Test

# Compile-check the app on every push/PR. Green main auto-cuts a release
# (release.yaml), which tags and triggers the TestFlight upload.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lints the backend: Deno format/lint/type-check for the Edge Functions,
  # then the migrations are applied to a scratch database (which proves they
  # run cleanly from zero) and `db lint` runs plpgsql_check over the result.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Functions (fmt, lint, type-check)
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions
          deno check supabase/functions/*/index.ts

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Migrations apply from zero + database lint
        run: |
          supabase db start
          supabase db lint --fail-on warning

  build:
    # macos-26 for the iOS 26 SDK, matching what testflight.yaml ships with.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Pinned, not `brew install`. Unpinned, a SwiftLint release that adds a
      # rule fails the next push whatever that push contains — and a local
      # binary a version behind lints clean, so nobody sees it coming.
      # Renovate keeps both current; see the custom manager in renovate.json,
      # which reads the annotations below.
      - name: Tooling
        env:
          # renovate: datasource=github-releases depName=realm/SwiftLint
          SWIFTLINT_VERSION: "0.65.1"
          # renovate: datasource=github-releases depName=yonaskolb/XcodeGen
          XCODEGEN_VERSION: "2.46.0"
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$tools/swiftlint"
          # xcodegen resolves its settings presets from `share/` beside the
          # binary, so the archive is kept whole rather than the binary copied
          # out of it.
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$tools"
          echo "$tools/swiftlint" >> "$GITHUB_PATH"
          echo "$tools/xcodegen/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches later steps, so these say by full path
          # what the rest of the job will be running.
          "$tools/swiftlint/swiftlint" version
          "$tools/xcodegen/bin/xcodegen" --version
          xcodebuild -version

      - name: Generate project
        run: |
          # Placeholder secrets: enough to compile; real values are injected
          # as build settings only in the TestFlight archive.
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Build (iOS Simulator, unsigned)
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if 'iPhone' in x['name']))")
          echo "Using simulator $SIM"
          xcodebuild build \
            -project Howday.xcodeproj -scheme Howday \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO
