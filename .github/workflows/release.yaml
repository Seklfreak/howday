name: Release

# Auto-cut a release on every green commit to main (Test must pass first).
# The bump decision, release notes, tagging and build dispatch all live in
# Seklfreak/ai-release-action — this file supplies only what is specific to
# howday.
#
# project-description is what the classifier judges "can this change reach a
# user?" against, so it must describe THIS project.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # push tag + create release
  actions: write # dispatch the build workflow

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Releasing a commit that main has already moved past is pointless — the
      # newer commit's own run covers this one, since the notes span everything
      # back to the last tag. It also fails outright when the newer commit
      # touched a workflow file: the tag would carry the older
      # .github/workflows to a ref whose default branch has the newer one, and
      # GitHub refuses that from an Actions token ("refusing to allow a GitHub
      # App to create or update workflow ... without `workflows` permission").
      - name: Skip a superseded commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TIP="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$TIP" = "$HEAD_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at ${TIP:0:7}, past ${HEAD_SHA:0:7}; leaving the release to that commit's run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.tip.outputs.stale == 'false'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the bump is read from the commit range
          fetch-tags: true # the previous tag is the baseline

      - uses: Seklfreak/ai-release-action@v1
        if: steps.tip.outputs.stale == 'false'
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Path filter: supabase/-only releases change the backend the app
          # talks to, not the app itself, so they need no new build.
          # testflight-refresh.yaml still rebuilds monthly, so the
          # TestFlight build cannot expire during a run of them.
          build-workflow: |
            testflight.yaml:^(App|Widgets|Notifications|Shared|Config)/|^project\.yml
          project-description: >-
            Howday is an iOS app (SwiftUI, whole repo) shipped to TestFlight
            on every version tag: one emoji a day, shared with friends.
            Changes under App/, Widgets/, Notifications/, Shared/ and
            supabase/ reach users — Widgets/ and Notifications/ are app
            extensions shipped inside the app, Shared/ is code compiled into
            all of them, and supabase/ holds the backend schema and Edge
            Functions the shipped app talks to. Only scripts/, Tests/, README
            and CI workflows live outside the released artifact.

            Wording rule for the release notes (they become the TestFlight
            "What to Test" text that testers and App Review read): NEVER use
            the word "mood", "feeling", "mental", "wellbeing", "health" or any
            other wording that frames the app as tracking how someone is. It is
            an emoji, a check-in, a day. Commit messages and identifiers in the
            diff (MoodEmoji, MoodTheme, "mood" in comments) do use the word —
            translate, do not quote. Say "emoji" or "check-in" instead.

            Bump policy: the app's TestFlight marketing version is the tag's
            major.minor, so a minor bump starts a NEW marketing version, and the first
            build of one needs a full Beta App Review — hours, sometimes a day — while
            later builds of an already-approved version are waved through. Worse,
            consecutive minor bumps withdraw each other's pending review, so a run of
            them can mean nothing reaches a tester at all. Reserve minor for genuinely
            new user-facing capability: a new screen, a new kind of notification, a new
            integration. Performance work, refactors, schema and infrastructure changes,
            dependency bumps, and layout or behaviour fixes are patch, however large the
            diff or however much care went into them.
