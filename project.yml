name: Howday
options:
  bundleIdPrefix: dev.winktech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.26.1
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  Howday:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - Shared
      - App/Assets.xcassets
      - App/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - target: HowdayNotifications
      - target: HowdayWidgets
    settings:
      base:
        # Keeps the old product's name on purpose: an App ID can't be
        # renamed, and this one already carries the App Store Connect record,
        # the TestFlight history and the push capability. (Nor is it
        # dev.winkler.moodring — that id got burned by an early build on the
        # personal team, and App IDs are unique across all teams.)
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moodring
        # Paid Developer Program team — required for TestFlight distribution.
        DEVELOPMENT_TEAM: LNHGT6463S
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: 1
        # Expanded into the entitlements file below. Debug (local device
        # runs) uses the APNs sandbox; Release/TestFlight uses production.
        # PushRegistrar's #if DEBUG sandbox flag must stay in sync with this.
        APS_ENVIRONMENT: development
      configs:
        # Manual signing for Release/archives, scoped to the app target only —
        # passing these on the xcodebuild command line applies them to SPM
        # package targets too, which refuse provisioning profiles. Debug (what
        # Xcode runs locally) stays on automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          # The profile's name at Apple, created before the rename.
          PROVISIONING_PROFILE_SPECIFIER: Moodring App Store
          APS_ENVIRONMENT: production
    entitlements:
      # Generated by xcodegen alongside the project. Requires the Push
      # Notifications capability on the App ID (and a regenerated App Store
      # profile) — see README "Push notifications".
      path: App/Howday.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        # Shared with the notification extension: the hash → name map it
        # reads lives in this container. The group is attached to both App
        # IDs in the developer portal (there is no API for that).
        com.apple.security.application-groups:
          - group.dev.winktech.moodring
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Howday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The design language is dark-first liquid crystal — the app is
        # dark-only by design, not just dark-compatible.
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        UMAMI_URL: $(UMAMI_URL)
        UMAMI_WEBSITE_ID: $(UMAMI_WEBSITE_ID)
        NSContactsUsageDescription: >-
          Howday is contacts-based: friends are matched by hashed phone
          numbers, and their names and photos are shown straight from your
          address book. Names and photos never leave your device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Notification Service Extension: rewrites "A friend just checked in" into
  # "Anna just checked in" on the device, from the sender's phone hash in
  # the payload and the name map the app keeps in the App Group container.
  # No network, no Contacts access — the map is all it reads.
  HowdayNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moodring.notifications
        DEVELOPMENT_TEAM: LNHGT6463S
        CODE_SIGN_STYLE: Automatic
        # Must match the containing app, or App Store Connect rejects the
        # upload; CI passes both on the command line, which reaches every
        # target.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Howday Notifications App Store
    entitlements:
      path: Notifications/HowdayNotifications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.winktech.moodring
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Howday Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # WidgetKit extension: the friends' moods afloat on the home screen. Reads
  # the board with the app's session (its keychain group is listed first in
  # the entitlements, so a token refresh made here lands where the app
  # looks) and names friends from the App Group name map. Display only —
  # nothing is written from the widget.
  HowdayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - App/Sources/Core/AppConfig.swift
      - App/Sources/Core/Supa.swift
      - App/Sources/Core/MoodTheme.swift
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moodring.widgets
        DEVELOPMENT_TEAM: LNHGT6463S
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Howday Widgets App Store
    entitlements:
      path: Widgets/HowdayWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.winktech.moodring
        # The app's own keychain group, listed first: reads find the
        # session the app stored, and writes (a token refresh) go there.
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.winktech.moodring
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Howday Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests for the pure pieces — phone parsing, contact candidates, the
  # wildcard, the local day, the reminder planner, the check-in queue —
  # which is where every client-side regression so far has been.
  HowdayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # The widget's pure layout, compiled into the tests directly: the
      # widget module itself can't be @testable-imported from an app-hosted
      # test bundle.
      - Widgets/SkyFriend.swift
      - Widgets/SkyLayout.swift
    dependencies:
      - target: Howday
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

# Explicit so the Howday scheme runs the tests: xcodegen's generated scheme
# for the app target alone would not, and CI runs `xcodebuild test`.
schemes:
  Howday:
    build:
      targets:
        Howday: all
        HowdayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HowdayTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
