name: MoodRing
options:
  bundleIdPrefix: dev.winktech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.26.1
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  MoodRing:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - App/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
    settings:
      base:
        # Not dev.winkler.moodring: that id got burned by an early build on
        # the personal team, and App IDs are unique across all teams.
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moodring
        # Paid Developer Program team — required for TestFlight distribution.
        DEVELOPMENT_TEAM: LNHGT6463S
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: 1
        # Expanded into the entitlements file below. Debug (local device
        # runs) uses the APNs sandbox; Release/TestFlight uses production.
        # PushRegistrar's #if DEBUG sandbox flag must stay in sync with this.
        APS_ENVIRONMENT: development
      configs:
        # Manual signing for Release/archives, scoped to the app target only —
        # passing these on the xcodebuild command line applies them to SPM
        # package targets too, which refuse provisioning profiles. Debug (what
        # Xcode runs locally) stays on automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Moodring App Store
          APS_ENVIRONMENT: production
    entitlements:
      # Generated by xcodegen alongside the project. Requires the Push
      # Notifications capability on the App ID (and a regenerated App Store
      # profile) — see README "Push notifications".
      path: App/MoodRing.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Moodring
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The design language is dark-first liquid crystal — the app is
        # dark-only by design, not just dark-compatible.
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        UMAMI_URL: $(UMAMI_URL)
        UMAMI_WEBSITE_ID: $(UMAMI_WEBSITE_ID)
        NSContactsUsageDescription: >-
          Moodring is contacts-based: friends are matched by hashed phone
          numbers, and their names and photos are shown straight from your
          address book. Names and photos never leave your device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
