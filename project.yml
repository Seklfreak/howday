name: MoodRing
options:
  bundleIdPrefix: dev.winkler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  MoodRing:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        # moodringapp, not moodring: the bare id got burned by an early build
        # on the personal team, and App IDs are unique across all teams.
        PRODUCT_BUNDLE_IDENTIFIER: dev.winkler.moodringapp
        # Paid Developer Program team — required for TestFlight distribution.
        DEVELOPMENT_TEAM: LNHGT6463S
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Moodring
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSContactsUsageDescription: >-
          Moodring reads your contacts only to find friends who already use
          the app. Phone numbers are hashed on your device before matching and
          are never stored on the server.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
